name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the pinned environment
        run: python -m pip install -r requirements.txt
      - name: Run the tests (theory, rules in closed loop, simulation core)
        run: python -m pytest -q
      - name: Recompute the summary tables and the figures from the stored runs
        run: |
          python scripts/analyse_theorems.py
          python scripts/make_figures.py
