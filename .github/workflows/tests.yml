name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the pinned environment
        run: python -m pip install -r requirements.txt
      - name: Run the tests on the synthetic inputs
        run: python -m pytest -q
      - name: Regenerate the tables of the article from the stored results
        run: |
          python scripts/make_results_tables.py
          python scripts/fig_results.py
