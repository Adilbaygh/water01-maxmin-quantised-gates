meta:
  name: dt_30min
  description: "Sensitivity (control step): control step of 30 min with two hydraulic steps of 15 min; settings given in steps are scaled so that their durations, and the rate limit per hour, are those of the 15-min baseline"
overrides:
  dt_s: {value: 1800.0, status: setting, source: "control step, 30 min (sensitivity of the control step)"}
  steps_per_day: {value: 48, status: setting, source: "86400 / dt_s"}
  plant_substeps: {value: 2, status: setting, source: "hydraulic step of 15 min, as in the baseline"}
  gate_rate_fraction_per_step: {value: 0.2, status: assumed, source: "0.10 per 15 min of the baseline, i.e. the same rate per hour"}
  execution_lookahead_steps: {value: 4, status: setting, source: "execution LP: rest of the day + 2 h"}
  execution_fine_steps: {value: 2, status: setting, source: "move blocking: first hour at dt"}
  execution_block_steps: {value: 2, status: setting, source: "then 1-h blocks"}
  message_window_steps: {value: 2, status: assumed, source: "1-h window"}
